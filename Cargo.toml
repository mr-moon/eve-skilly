[package]
name = "skilly"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local EVE Online skill planner and attribute optimizer"
license = "MIT"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "2"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = "9"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }

[profile.release]
lto = "thin"


# Keep local test/dev artifacts small. Desktop release settings stay unchanged.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
